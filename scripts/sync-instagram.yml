# Move this file to .github/workflows/sync-instagram.yml when the Instagram sync is set up (SETUP.md section 4).
name: Sync Instagram edit

on:
  schedule:
    - cron: '17 4 * * *'   # 06:17 SAST every day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-instagram
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Update catalogue.json and product photos
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ] || [ -z "$IG_USER_ID" ]; then echo "Instagram sync not set up yet (no secrets); skipping."; exit 0; fi
          node scripts/sync-instagram.mjs
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue.json assets/products
          git diff --cached --quiet || git commit -m "Sync Instagram catalogue"
          git push
